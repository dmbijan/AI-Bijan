name: CI — Ujian & Keselamatan

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  struktur:
    name: Struktur & Dokumen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Salin .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Sediakan pangkalan data SQLite
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Sahkan angka dokumen vs kod
        # Exit 1 jika modul/jadual/laluan/resource/kebenaran/model/service/controller/migration
        # dalam KATALOG-MODUL-AI-BIJAN.md atau SISTEM-AI-BIJAN.md tidak sepadan dengan kod.
        run: php skrip/semak-dokumen.php

      - name: Jana baseline metrik (artefak)
        # Menjana docs/AUDIT-BASELINE.md daripada kod sebenar — TIDAK menulis
        # ke working tree, hanya menghasilkan artefak untuk semakan.
        run: php skrip/jana-baseline.php --tolak=baseline-ci.md

      - name: Muat naik artefak baseline
        uses: actions/upload-artifact@v4
        with:
          name: audit-baseline
          path: baseline-ci.md

      - name: Periksa baseline dalam repo (baseline drifted?)
        # Jika AUDIT-BASELINE.md tidak sepadan dengan kod, CI gagal — pemaju
        # wajib jalankan `php skrip/jana-baseline.php --tulis` dan commit.
        run: |
          php skrip/jana-baseline.php --tolak=baseline-semasa.md
          # Bandingkan jadual metrik (baris "| METRIK |" hingga baris kosong)
          extract() { sed -n '/^| METRIK |/,/^$/p' "$1"; }
          if ! diff -u <(extract docs/AUDIT-BASELINE.md) <(extract baseline-semasa.md); then
            echo "::error::docs/AUDIT-BASELINE.md tidak sepadan dengan kod sebenar."
            echo "Jalankan: php skrip/jana-baseline.php --tulis"
            exit 1
          fi
          echo "Baseline sepadan dengan kod."

      - name: Audit pengasingan tenant
        # Exit 1 jika ada model dengan kolum tenant_id TANPA BelongsToTenant
        # (dan tiada dalam config/tenant-global-models.php).
        # Pepijat sebenar: CommunitySpace/Post/Reply, JournalEntryLine (Okt 2026).
        run: php skrip/audit-tenant.php

      - name: Semak laluan wildcard (MESTI kosong)
        run: |
          WILDCARD=$(php artisan route:list --path=api/v1 --json | grep -c 'api/v1/{' || true)
          echo "Laluan wildcard ditemui: $WILDCARD"
          if [ "$WILDCARD" != "0" ]; then
            echo "::error::Laluan wildcard api/v1/{id} dikesan — provider modul tiada prefix."
            php artisan route:list --path=api/v1 | grep 'api/v1/{' || true
            exit 1
          fi

      - name: Semak prefix berganda (MESTI kosong)
        # Pepijat sebenar: provider daftar api/v1/finance DAN module routes/api.php
        # juga ada Route::prefix('finance') → api/v1/finance/finance/*.
        # 154 laluan rosak ditemui 26 Okt 2026. Jangan biar berulang.
        run: |
          BERG=$(php artisan route:list --json \
            | php -r '$r=json_decode(stream_get_contents(STDIN),true);$n=0;foreach($r as $x){if(preg_match("#^api/v1/([a-z-]+)/\\1(/|$)#",$x["uri"])){$n++;fwrite(STDERR,$x["uri"].PHP_EOL);}}echo $n;' || true)
          echo "Laluan prefix berganda: $BERG"
          if [ "$BERG" != "0" ]; then
            echo "::error::$BERG laluan mempunyai prefix berganda (cth api/v1/finance/finance/*)."
            echo "Buang Route::prefix(...) dalam app/Modules/<X>/routes/api.php — provider sudah menambahnya."
            exit 1
          fi

  ujian:
    name: Ujian PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Salin .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan ujian penuh
        # AI_GATEWAY_LIVE=false (lalai) — ujian AI guna mod simulasi, tiada kos/kunci.
        env:
          AI_GATEWAY_LIVE: 'false'
        run: php artisan test --without-tty

  keselamatan:
    name: Keselamatan Pakej
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer audit
        # Gagal jika ada advisori keselamatan terbuka.
        run: composer audit

  gaya:
    name: Gaya PHP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # Peringatan sahaja — jangan sekat merge
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Semak sintaks PHP (seluruh app/)
        run: |
          gagal=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "::warning file=$f::Ralat sintaks"; gagal=1; }
          done < <(find app routes config database skrip -name '*.php' -type f)
          exit 0

      - name: Kesan aksara CJK/tersembunyi dalam kod
        # Pepijat sebenar: ruang tersembunyi memecahkan nama kaedah PHP.
        run: |
          if grep -rIlP '[\x{4e00}-\x{9fff}]' app routes 2>/dev/null; then
            echo "::warning::Aksara CJK dikesan dalam kod PHP — semak ruang tersembunyi."
          else
            echo "Bersih."
          fi
